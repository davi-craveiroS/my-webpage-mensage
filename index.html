<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Dancing+Script:wght@400..700&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <style>
        html,
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #2020ff;
            height: 100dvh;
        }

        .container {
            display: flex;
            flex-shrink: 1;
            flex-wrap: nowrap;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: auto;
            height: 80%;
            width: 60%;
            background-color: #fff;
            border-radius: 12px;
            padding: 5%;
            gap: 0.3rem;
        }

        label {
            text-align: left;
            width: 50%;
            font-family: "Nunito";
            font-size: 1.1rem;
            font-weight: 700;
            flex-shrink: 1;
        }

        .input-stle,
        .submit-button-stle {
            color: #000;
            background-color: #c2c2c2;
            border: none;
            width: 50%;
            height: 32px;
            cursor: pointer;
            border-radius: 6px;
            padding: 2%;
            flex-shrink: 1;
        }

        .input-stle:focus {
            outline: none;
            box-shadow: 1px 1px 7px #2020ff;
        }

        .input-stle::placeholder {
            color: #303030;
        }

        .submit-button-stle {
            padding: 0;
            transition: all 0.2s;
            min-height: 31.88px;
        }

        .submit-button-stle:hover {
            color: #fff;
            background-color: #2020ff;
        }

        .input-mensagem {
            overflow: hidden;
            resize: none;
            text-align: left;
            padding: 8px;
            min-height: 31.88px;
        }

        h1 {
            font-family: "Caveat";
            font-size: 2.6rem;
            margin-bottom: 1rem;
        }

        @media screen and (max-width:650px) {
            .container {
                width: 90%;
                height: 60%;
                padding: 0;
            }

            label {
                font-size: 1rem;
                width: 70%;
            }

            .input-stle,
            .submit-button-stle {
                width: 70%;
            }
        }
    </style>
</head>

<body>
    <form action="https://formsubmit.co/craveiro5contato@gmail.com" method="post" class="container">
        <h1>Envie-Me Um E-mail</h1>
        <label for="name">Nome Completo:</label>
        <input type="text" name="name" placeholder="digite seu nome..." class="input-name input-stle"> <br>
        <label for="email">Email do usuario:</label>
        <input type="email" placeholder="digite seu email..." name="email" class="input-email input-stle"> <br>
        <label for="mensagem">Sua Mensagem:</label>
        <textarea name="mensagem" class="input-stle input-mensagem" placeholder="Digite alguma coisa..."></textarea>
        <br>
        <button id="submit-button" class="submit-button-stle">Enviar Mensagem</button>
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_next" value="https://davi-craveiros.github.io/my-webpage-mensage/thanks.html">
        </div>
</body>

</html>
